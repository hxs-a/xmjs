<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>品牌介绍</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 主色调 - 深紫色国潮风 */
            --primary-purple: #4A235A;
            --secondary-purple: #6C3483;
            --light-purple: #9B59B6;
            --gold: #D4AF37;
            --light-gold: #F4D03F;
            --cream: #FDF5E6;
            --dark-text: #2C1338;
            --light-text: #F8F4F9;
            --card-bg: linear-gradient(135deg, #5D2E7A 0%, #3A1A4D 100%);
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #FDF5E6 0%, #F5E6D3 50%, #E8D5C4 100%);
            color: var(--dark-text);
            line-height: 1.8;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部品牌区 */
        .header {
            background: linear-gradient(180deg, var(--primary-purple) 0%, var(--secondary-purple) 100%);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23D4AF37' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            position: relative;
        }
        
        .sun-rays {
            width: 60px;
            height: 30px;
            background: var(--gold);
            border-radius: 60px 60px 0 0;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                -25px 5px 0 -5px var(--gold),
                25px 5px 0 -5px var(--gold),
                -40px 15px 0 -10px var(--gold),
                40px 15px 0 -10px var(--gold);
        }

        .leaves {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 45px;
        }

        .leaves::before,
        .leaves::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 35px;
            height: 45px;
            background: linear-gradient(135deg, #27AE60 0%, #1E8449 100%);
            border-radius: 50% 50% 50% 0;
        }
        
        .brand-intro {
           white-space: pre-line;  /* 识别 \n 并换行显示 */
        }

        .leaves::before {
            left: 0;
            transform: rotate(-30deg);
        }

        .leaves::after {
            right: 0;
            transform: rotate(30deg) scaleX(-1);
        }

        .logo-text h1 {
            font-size: 28px;
            color: var(--light-gold);
            letter-spacing: 4px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .logo-text p {
            font-size: 14px;
            color: var(--cream);
            letter-spacing: 3px;
            opacity: 0.9;
        }

        /* 视频区 */
        .video-section {
            padding: 20px;
            background: linear-gradient(180deg, var(--secondary-purple) 0%, #5D2E7A 100%);
        }

        .video-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(74, 35, 90, 0.4);
            border: 3px solid var(--gold);
        }

        .video-container video {
            width: 100%;
            display: block;
            background: #000;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .video-overlay.hidden {
            opacity: 0;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s, background 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: var(--light-gold);
        }

        .play-btn svg {
            width: 30px;
            height: 30px;
            fill: var(--primary-purple);
            margin-left: 5px;
        }

        /* 通用标题 */
        .section-title {
            text-align: center;
            font-size: 24px;
            color: var(--primary-purple);
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 12px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 2px;
        }

        /* 品牌介绍区 */
        .intro-section {
            padding: 40px 20px;
        }

        .intro-card {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(74, 35, 90, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .intro-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-purple), var(--gold), var(--primary-purple));
            border-radius: 16px 16px 0 0;
        }

        .intro-text {
            color: var(--dark-text);
            font-size: 16px;
            line-height: 2;
            text-align: justify;
            white-space: pre-line;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin-top: 25px;
        }

        /* 新闻报道区 */
        .news-section {
            padding: 30px 20px;
        }

        .news-list {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-item {
            background: white;
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--dark-text);
            transition: all 0.3s;
            border-left: 4px solid var(--gold);
            box-shadow: 0 2px 12px rgba(74, 35, 90, 0.08);
        }

        .news-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 20px rgba(74, 35, 90, 0.15);
            border-left-color: var(--light-purple);
        }

        .news-title {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
        }

        .news-arrow {
            color: var(--gold);
            font-size: 18px;
            transition: transform 0.3s;
            flex-shrink: 0;
            margin-left: 15px;
        }

        .news-item:hover .news-arrow {
            transform: translateX(3px);
        }

        /* 功能卡片区 */
        .cards-section {
            padding: 40px 20px 60px;
        }

        .cards-grid {
            max-width: 700px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            color: var(--light-text);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            box-shadow: 0 6px 20px rgba(74, 35, 90, 0.3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, transparent 50%, rgba(212, 175, 55, 0.3) 50%);
        }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:active {
            transform: translateY(-3px);
            border-color: var(--gold);
        }

        .card:hover::after,
        .card:active::after {
            opacity: 1;
        }

        .card-icon {
            font-size: 36px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--light-gold);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }

        .card-desc {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        /* 底部 */
        .footer {
            background: var(--primary-purple);
            color: var(--cream);
            text-align: center;
            padding: 25px 20px;
            font-size: 14px;
        }

        .footer-sub {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--cream);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn 0.3s ease;
            border: 3px solid var(--gold);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--primary-purple);
            color: var(--gold);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .modal-close:hover {
            background: var(--secondary-purple);
        }

        .modal-content {
            padding: 35px 30px 30px;
            color: var(--dark-text);
        }

        .modal-content h2 {
            color: var(--primary-purple);
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gold);
        }

        .modal-content h3 {
            color: var(--secondary-purple);
            margin: 18px 0 10px;
            font-size: 18px;
        }

        .modal-content p {
            margin-bottom: 12px;
            line-height: 1.8;
            text-align: justify;
        }

        /* 弹窗图片样式 */
        .modal-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 15px rgba(74, 35, 90, 0.15);
            margin: 15px 0 20px;
            display: block;
            object-fit: cover;
        }

        /* 响应式适配 - 平板与手机 */
        @media (max-width: 768px) {
            .section-title {
                font-size: 22px;
            }

            .intro-card {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {
            /* 顶部logo适配 */
            .logo-icon {
                width: 65px;
                height: 65px;
            }

            .sun-rays {
                width: 48px;
                height: 24px;
                box-shadow: 
                    -20px 4px 0 -5px var(--gold),
                    20px 4px 0 -5px var(--gold),
                    -32px 12px 0 -10px var(--gold),
                    32px 12px 0 -10px var(--gold);
            }

            .leaves {
                width: 58px;
                height: 38px;
            }

            .leaves::before,
            .leaves::after {
                width: 29px;
                height: 38px;
            }

            .logo-text h1 {
                font-size: 22px;
                letter-spacing: 3px;
            }

            .logo-text p {
                font-size: 12px;
                letter-spacing: 2px;
            }

            /* 区块间距适配 */
            .header {
                padding: 25px 15px;
            }

            .video-section {
                padding: 15px;
            }

            .video-container {
                border-width: 2px;
                border-radius: 10px;
            }

            .play-btn {
                width: 60px;
                height: 60px;
            }

            .play-btn svg {
                width: 26px;
                height: 26px;
            }

            .section-title {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .intro-section {
                padding: 30px 15px;
            }

            .intro-card {
                padding: 20px;
                border-radius: 12px;
            }

            .intro-text {
                font-size: 15px;
                line-height: 1.9;
            }

            .news-section {
                padding: 25px 15px;
            }

            .news-item {
                padding: 12px 16px;
                border-radius: 8px;
            }

            .news-title {
                font-size: 14px;
            }

            .cards-section {
                padding: 30px 15px 50px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .card {
                padding: 22px 15px;
                border-radius: 12px;
            }

            .card-icon {
                font-size: 32px;
            }

            .card-title {
                font-size: 16px;
            }

            /* 弹窗移动端适配 */
            .modal-overlay {
                padding: 15px;
            }

            .modal {
                border-width: 2px;
                border-radius: 12px;
                max-height: 85vh;
            }

            .modal-close {
                top: 12px;
                right: 12px;
                width: 32px;
                height: 32px;
                font-size: 20px;
            }

            .modal-content {
                padding: 28px 20px 22px;
            }

            .modal-content h2 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .modal-content h3 {
                font-size: 16px;
                margin: 15px 0 8px;
            }

            .modal-content p {
                font-size: 14px;
            }

            .modal-img {
                border-radius: 8px;
                border-width: 2px;
                margin: 12px 0 16px;
            }

            .footer {
                padding: 20px 15px;
                font-size: 13px;
            }
        }

        @media (min-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 顶部品牌区 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <div class="sun-rays"></div>
                <div class="leaves"></div>
            </div>
            <div class="logo-text">
                <h1>黑米基双蛋白凝胶-吞咽友好型产品</h1>
                <p>DABACAI</p>
            </div>
        </div>
    </header>

    <!-- 视频播放区 -->
    <section class="video-section">
        <div class="video-container">
            <video id="brandVideo" controls poster="">
                <source src="assets/video.mp4" type="video/mp4">
                您的浏览器不支持视频播放
            </video>
            <div class="video-overlay">
                <div class="play-btn" id="playBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
            </div>
        </div>
    </section>

    <!-- 品牌介绍区 -->
    <section class="intro-section">
        <div class="intro-card">
            <h2 class="section-title">品牌简介</h2>
            <p class="intro-text" id="brandIntro"></p>
            <div class="divider"></div>
        </div>
    </section>

    <!-- 新闻报道区 -->
    <section class="news-section">
        <h2 class="section-title">新闻报道</h2>
        <div class="news-list" id="newsList"></div>
    </section>

    <!-- 功能卡片区 -->
    <section class="cards-section">
        <h2 class="section-title">了解更多</h2>
        <div class="cards-grid" id="cardsGrid"></div>
    </section>

    <!-- 底部 -->
    <footer class="footer">
        <p>&copy; 2026 吞咽友好型品牌</p>
        <p class="footer-sub">东莞理工学院 · 生命健康技术学院技术支撑</p>
    </footer>

    <!-- 弹窗容器 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        // ==================== 配置区域 - 轻松修改内容 ====================
            
        const siteConfig = {
            
            // 品牌介绍文字
            brandIntro: `本项目由东莞理工学院生命健康技术学院核心团队牵头，深度依托广东省“百千万工程”专家智库、第二轮农村科技特派员官方帮扶体系搭建专业导师团，由熊舟翼副研究员、肖珊教授、邹水洋副教授三位省市级智库专家全程提供全链条技术支撑，聚焦吞咽障碍人群进食呛咳、营养供给不足两大民生痛点开展研发与产业落地。 \n项目以粤东普宁市里湖镇本地特色黑米为核心原料，独创双蛋白互作凝胶精准调控工艺，研发适配不同吞咽等级、营养均衡的黑米基专用特膳食品，配套形成筛查评估+个性化膳食+产业助农一体化完整精准营养解决方案。项目双向赋能两大领域：一是为吞咽障碍老人、术后进食困难、失能人群提供安全、易吸收的标准化健康膳食保障；二是推动普宁黑米本地粮油精深加工，破解原粮低价售卖困境，带动村集体与农户稳定增收，实现民生康养服务、乡村产业提质双向增效，助力县镇村高质量协同发展。`,

            // 新闻报道列表
            newsList: [
                {
                    title: "双向奔赴结硕果！东莞理工交出 “双百行动” 亮眼成绩单",
                    url: "https://mp.weixin.qq.com/s?__biz=MzAxNjA5NDIzMA==&mid=2652315252&idx=1&sn=8f75303dc79a73a6a5c8997c81c27f0e&chksm=81320e6d4381cac3e0fd88d7674a3060711a1f66dc8a4103a37f27ec0a8336d5f7951e11b5d6&scene=27"
                },
                {
                    title: "高校专家团队入驻普宁智库，科技特派员打通黑米产业转化链条",
                    url: "https://edu.gd.gov.cn/jyzxnew/zxlb/gx/content/post_4452026.html"
                },
                {
                    title: "中科院团队系统梳理吞咽食品研究进展，搭建理化调控到临床获益转化新框架",
                    url: "https://mp.weixin.qq.com/s/aLuBLN53W2N3ax2qrad4pw"
                }
            ],

            // 四个功能卡片
            cards: [
                {
                    id: "story",
                    icon: "📖",
                    title: "我们的故事",
                    desc: "品牌发展历程",
                    content: {
                        title: "我们的故事",
                        html: `
